<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals - Var Notes</title>
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <nav class="dash-nav">
    <div class="dash-logo">Var<span>Notes</span></div>

    <div class="dash-nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="notes.html">Notes</a>
      <a href="goals.html" class="active">Goals</a>
    </div>

    <div class="dash-nav-right">
      <button class="cmdk-trigger" id="cmdkTrigger" type="button" aria-label="Open command palette (Ctrl+K)">Ctrl K</button>
      <span class="dash-username js-username"></span>
      <div class="dash-avatar js-initial">?</div>
      <button class="logout-btn js-logout">Log out</button>
    </div>
  </nav>

  <main class="dash-main">

    <div class="page-head">
      <h1>Goals</h1>
      <p>Turn a note into something trackable, then check it off.</p>
    </div>

    <form id="goalForm" class="entry-form" novalidate>
      <div class="entry-form-row">
        <div class="form-group">
          <label class="form-label" for="goalTitle">Title</label>
          <input
            type="text"
            id="goalTitle"
            class="form-control"
            placeholder="What are you working toward?"
            autofocus
          >
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="goalDue">Due date</label>
          <input type="date" id="goalDue" class="form-control">
        </div>
      </div>

      <div class="entry-form-actions">
        <button type="submit" class="btn-auth btn-inline" id="goalSubmitBtn">Add Goal</button>
      </div>
    </form>

    <div class="search-row">
      <input
        type="search"
        id="goalSearch"
        class="search-input"
        placeholder="Search goals..."
        aria-label="Search goals"
      >
    </div>

    <div class="entry-list goals-list"></div>
    <p class="entry-empty goals-empty" hidden>No goals yet — add your first one above.</p>
    <p class="entry-empty goals-search-empty" hidden>No goals match your search.</p>

  </main>

  <script type="module" src="/src/goals.js"></script>

</body>
</html>
