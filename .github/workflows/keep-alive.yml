name: Keep Supabase Alive

# Supabase's free tier pauses a project after 7 days with no API activity,
# which makes the deployed site unreachable for real visitors until someone
# manually resumes it from the dashboard. Pinging the project twice a week
# keeps it under that threshold with margin, so a single delayed run can't
# accidentally cross it.
#
# This doubles as monitoring: if the ping ever fails (project actually
# down, a Supabase account limit hit again, etc.), this workflow run fails.
# On top of GitHub's own failed-workflow email (easy to miss/filter), a
# failing run opens a repo issue labeled `keep-alive-failure` — visible in
# the repo and enough to trigger a GitHub mobile push if you have the app.
# A later successful run auto-closes it, so an open issue always means
# "currently down," not just "failed once a while ago."
#
# Note: GitHub disables scheduled workflows after 60 days of no other repo
# activity (commits, PRs, etc.). Not a concern during active development,
# but worth knowing if this repo goes quiet for a couple of months.

on:
  schedule:
    - cron: '0 12 * * 1,4' # Monday and Thursday, 12:00 UTC
  workflow_dispatch: # allows a manual "Run workflow" click to test it

permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Ping Supabase
        run: node scripts/check-supabase.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'keep-alive-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The Supabase keep-alive ping failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'This usually means the project auto-paused (free tier, 7 days idle) and needs a manual **Resume project** click in the Supabase dashboard. This issue closes automatically once a ping succeeds again.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing.\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔴 Supabase keep-alive ping failed',
                body,
                labels: [label]
              });
            }

      - name: Close failure issue if the ping just succeeded
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'keep-alive-failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Ping succeeded again — closing.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
